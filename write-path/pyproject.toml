[project]
name = "wpbench"
version = "0.1.0"
description = "Benchmark of a simulated write path (marker, revision token, search probe)"
requires-python = ">=3.12,<3.13"
dependencies = ["pymongo>=4.13", "numpy>=2.0", "psutil>=6.0"]

[project.scripts]
wpbench = "wpbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpbench"]
