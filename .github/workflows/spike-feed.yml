name: spike-feed
# Change-stream experiments on a plain replica set: streams per process, lazy open with replay, sharing between
# processes, resume and error causes, memory of the event log. Dispatch one group at a time; see spikes/RUNBOOK.md.
on:
  workflow_call:
    inputs:
      group:
        type: string
        required: true
      trials:
        type: string
        default: "10000"
      occasion:
        type: string
        default: "run1"
  workflow_dispatch:
    inputs:
      group:
        description: "Which job group to run"
        type: choice
        default: streams
        options: [streams, lazy, share, resume, memory]
      trials:
        description: "Trials for the lazy-open test (group lazy)"
        type: string
        default: "10000"
      occasion:
        description: "Label of this occasion, for example run1-morning (goes into the artifact name)"
        type: string
        default: "run1"
permissions:
  contents: read
defaults:
  run:
    shell: bash
    working-directory: spikes/feed
jobs:
  streams:
    if: inputs.group == 'streams'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Start the databases
        run: |
          chmod +x containers.sh; ./containers.sh main; sleep 10
      - name: One database stream against one per collection
        run: |
          uv run python exp1.py
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker ps -a > results/containers.txt || true
          for c in hoodie-s3-mongo hoodie-s3-redis hoodie-s3-solo hoodie-s3-auth; do docker logs "$c" 2>&1 | tail -n 500 > "results/$c.log" || true; done
          ./containers.sh rm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-feed-${{ inputs.occasion }}-streams
          path: spikes/feed/results
          retention-days: 90
  lazy:
    if: inputs.group == 'lazy'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Start the databases
        run: |
          chmod +x containers.sh; ./containers.sh main; sleep 10
      - name: Open after the write at its own operation time, with the negative control
        run: |
          uv run python exp2.py session ${{ inputs.trials }} 16 0
          uv run python exp2.py cmd 3000 16 0
          uv run python exp2.py read 300 16 0
          uv run python exp2q.py
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker ps -a > results/containers.txt || true
          for c in hoodie-s3-mongo hoodie-s3-redis hoodie-s3-solo hoodie-s3-auth; do docker logs "$c" 2>&1 | tail -n 500 > "results/$c.log" || true; done
          ./containers.sh rm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-feed-${{ inputs.occasion }}-lazy
          path: spikes/feed/results
          retention-days: 90
  share:
    if: inputs.group == 'share'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Start the databases
        run: |
          chmod +x containers.sh; ./containers.sh main; sleep 10
      - name: Own streams, leader through a collection, leader through Redis, marker stream
        run: |
          for m in own capped redis marker; do uv run python exp3.py $m; done
          uv run python exp3.py redis kill
          uv run python exp3.py own marker
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker ps -a > results/containers.txt || true
          for c in hoodie-s3-mongo hoodie-s3-redis hoodie-s3-solo hoodie-s3-auth; do docker logs "$c" 2>&1 | tail -n 500 > "results/$c.log" || true; done
          ./containers.sh rm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-feed-${{ inputs.occasion }}-share
          path: spikes/feed/results
          retention-days: 90
  resume:
    if: inputs.group == 'resume'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Start the databases
        run: |
          chmod +x containers.sh; ./containers.sh main; sleep 10
          ./containers.sh solo; ./containers.sh auth
      - name: Connection kill and resume
        run: |
          uv run python exp4.py auto
          uv run python exp4.py manual
      - name: Why a stream cannot open
        run: |
          uv run python exp5.py causes
          uv run python exp5.py pool
          uv run python exp5.py zombie
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker ps -a > results/containers.txt || true
          for c in hoodie-s3-mongo hoodie-s3-redis hoodie-s3-solo hoodie-s3-auth; do docker logs "$c" 2>&1 | tail -n 500 > "results/$c.log" || true; done
          ./containers.sh rm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-feed-${{ inputs.occasion }}-resume
          path: spikes/feed/results
          retention-days: 90
  memory:
    if: inputs.group == 'memory'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Start the databases
        run: |
          chmod +x containers.sh; ./containers.sh main; sleep 10
      - name: Bytes per entry and a live consumer
        run: |
          uv run python exp6.py static
          for r in 500 1000; do for i in sketch fixed; do uv run python exp6.py live $i $r 10000; done; done
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker ps -a > results/containers.txt || true
          for c in hoodie-s3-mongo hoodie-s3-redis hoodie-s3-solo hoodie-s3-auth; do docker logs "$c" 2>&1 | tail -n 500 > "results/$c.log" || true; done
          ./containers.sh rm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-feed-${{ inputs.occasion }}-memory
          path: spikes/feed/results
          retention-days: 90
