name: narrowing-ci

# Smoke run on every push that touches the narrowing benchmark: proves the harness still works end to end.
# Smoke numbers are never results (5,000 documents, a few repetitions).

on:
  push:
    paths:
      - "narrowing/**"
      - ".github/workflows/narrowing-*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: narrowing
    env:
      NAME: nbench-engine
      LABEL: smoke-ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Disk and Docker
        run: |
          df -h /
          docker version --format '{{.Server.Version}}'
      - name: Start the engine
        run: bash scripts/start-engine.sh "$NAME" 27102 3 8g
      - name: Environment record
        run: uv run nbench env --label "$LABEL" --container "$NAME"
      - name: Load, build indexes
        run: uv run nbench load --label "$LABEL" --scale smoke --container "$NAME"
      - name: Planner path self-test (every branch, with asserts)
        run: uv run nbench selftest
      - name: Limits
        run: uv run nbench limits --label "$LABEL" --scale smoke
      - name: Measurement phases (smoke)
        run: uv run nbench run --label "$LABEL" --scale smoke --phases all --reps 2 --noise-reps 3 --seed "$GITHUB_RUN_NUMBER"
      - name: Load test (smoke)
        run: uv run nbench load-test --label "$LABEL" --scale smoke --container "$NAME" --rates 5,10 --duration 3 --cooldown 1
      - name: Analysis
        run: |
          uv run nbench analyze --runs "results/$LABEL" --out "results/$LABEL/tables.md"
          head -c 900000 "results/$LABEL/tables.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Disk
        if: always()
        run: df -h /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: narrowing-smoke-ci
          path: narrowing/results/smoke-ci
          retention-days: 7

  # Hosted Atlas M0 on every push, in parallel with the local smoke job. All M0 jobs of every workflow in this
  # repository share one concurrency group, so they queue instead of running at the same time: the free cluster
  # holds 0.5 GB, allows 100 operations per second and only 3 search indexes, and the M0 tasks use fixed
  # collection names that they drop at the start and at the end. GitHub keeps one pending run per group, so a
  # newer queued run replaces an older queued one (a running one is never cancelled).
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: m0-cluster
      cancel-in-progress: false
    defaults:
      run:
        working-directory: narrowing
    env:
      LABEL: smoke-ci-m0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: M0 tasks (skipped without the secret)
        env:
          HOODIE_BENCH_ATLAS_URL: ${{ secrets.HOODIE_BENCH_ATLAS_URL }}
        run: uv run nbench m0 --label "$LABEL" --docs 3000 --reps 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: narrowing-smoke-ci-m0
          path: narrowing/results/smoke-ci-m0
          retention-days: 7
          if-no-files-found: ignore
