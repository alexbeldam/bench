name: spike-fl2-es-smoke
# Harness check on every push that touches the harness: every group at its smallest input on one image. Its timings are NOT results.
on:
  push:
    paths: ["spikes/flakiness2/es/**", ".github/workflows/spike-fl2-es.yml", ".github/workflows/spike-fl2-es-smoke.yml"]
  pull_request:
    paths: ["spikes/flakiness2/es/**", ".github/workflows/spike-fl2-es.yml", ".github/workflows/spike-fl2-es-smoke.yml"]
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: start, n: "1"}
          - {group: lag, n: "2"}
          - {group: stale, n: "2"}
          - {group: ties, n: "2"}
          - {group: races, n: "2"}
          - {group: stress, n: "10"}
    uses: ./.github/workflows/spike-fl2-es.yml
    with:
      group: ${{ matrix.group }}
      n: ${{ matrix.n }}
      occasion: smoke-ci
      images: '["es-9.5.5"]'
