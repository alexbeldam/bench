name: narrowing-m0

# Hosted Atlas M0 tasks (informational, a different environment). Runs only if the repository secret
# HOODIE_BENCH_ATLAS_URL exists. Secrets are masked by GitHub, and the harness redacts every message as well.
# No Docker, no scale: limits, ties, a small strategy comparison. Throttled to 40 operations per second.

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Results directory and artifact name"
        required: true
        default: m0
      docs:
        description: "Documents to load (the free cluster holds 0.5 GB; the harness stops at 80%)"
        required: true
        default: "20000"

permissions:
  contents: read

jobs:
  m0:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One M0 job at a time across every workflow (see narrowing-ci.yml).
    concurrency:
      group: m0-cluster
      cancel-in-progress: false
    defaults:
      run:
        working-directory: narrowing
    env:
      LABEL: ${{ inputs.label }}
      DOCS: ${{ inputs.docs }}
      HOODIE_BENCH_ATLAS_URL: ${{ secrets.HOODIE_BENCH_ATLAS_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: M0 tasks
        run: uv run nbench m0 --label "$LABEL" --docs "$DOCS"
      - name: Summary
        run: |
          if [ -f "results/$LABEL/m0.json" ]; then { echo '```json'; cat "results/$LABEL/m0.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; else echo "M0 skipped: the secret is not set." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: narrowing-${{ inputs.label }}
          path: narrowing/results/${{ inputs.label }}
          retention-days: 90
