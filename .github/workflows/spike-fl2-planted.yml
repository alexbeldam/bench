name: spike-fl2-planted
# Planted-flake strategy benchmark. Group inmem: one job per strategy family, no container. Group real: one job per test shard,
# own runner and engine. Push runs the smoke variants only.
on:
  push:
    paths:
      - "spikes/flakiness2/**"
      - ".github/workflows/spike-fl2-planted.yml"
      - "write-path/scripts/ci-start-engine.sh"
  workflow_dispatch:
    inputs:
      group:
        description: "Which group to run"
        type: choice
        default: inmem
        options: [inmem, real, both]
      scale:
        description: "smoke or full"
        type: choice
        default: full
        options: [smoke, full]
      reps:
        description: "Experiments (K) for the suite level strategies"
        type: string
        default: "100"
      duration:
        description: "Time budget per test for a pool, seconds (a pool is cut where n runs would exceed it)"
        type: string
        default: "45"
      warm:
        description: "Untimed warm-up runs per test before a pool"
        type: string
        default: "3"
      mult:
        description: "Multiplier of the real-engine pool sizes"
        type: string
        default: "1.0"
      seed:
        description: "Seed of the shuffled run orders (empty: drawn and logged)"
        type: string
        default: ""
      occasion:
        description: "Label of this occasion, for example run1 (goes into the artifact name)"
        type: string
        default: "run1"
permissions:
  contents: read
env:
  WP_CONTAINER: hoodie-fl2-planted
  WP_PORT: "29401"
  WP_CPUS: "3"
  WP_MEM: "10g"
  FL2P_URI: "mongodb://127.0.0.1:29401/?directConnection=true"
defaults:
  run:
    shell: bash
    working-directory: spikes/flakiness2/planted
jobs:
  smoke-inmem:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: sudo apt-get update -y >/dev/null && sudo apt-get install -y stress-ng >/dev/null
      - name: Smoke, every in-memory phase at tiny scale
        run: mkdir -p results && uv run fl2p smoke --out-dir results/smoke 2>&1 | tail -n 60
      - name: Table check
        run: test -s results/smoke/report/tables.md && head -n 40 results/smoke/report/tables.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-planted-smoke-inmem
          path: spikes/flakiness2/planted/results/smoke/report
          retention-days: 7
  smoke-real:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../../write-path/scripts/ci-start-engine.sh
      - name: Smoke, every real-engine test a few times
        run: |
          mkdir -p results/smoke-real
          for s in settle tx purge; do
            uv run fl2p real --shard "$s" --n-scale smoke --smoke-n 3 --workers 2 --arms base,engine1 --arm-tests r-settle-b1.01,r-tx-partial-b1.02,r-stale-total --arm-frac 1.0 --out-dir results/smoke-real
          done
          uv run fl2p analyze results/smoke-real --out results/smoke-real/report
        timeout-minutes: 20
      - name: Finish
        if: always()
        run: |
          mkdir -p results/smoke-real; docker logs "$WP_CONTAINER" 2>&1 | tail -n 200 > results/smoke-real/engine.log || true
          docker rm -f "$WP_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-planted-smoke-real
          path: spikes/flakiness2/planted/results/smoke-real
          retention-days: 7
  inmem:
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'inmem' || inputs.group == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        family: [pool, suite, forced, noise, prop, repeat, meta]
    env:
      SCALE: ${{ inputs.scale }}
      REPS: ${{ inputs.reps }}
      DUR: ${{ inputs.duration }}
      SEED: ${{ inputs.seed }}
      FL2P_WARM: ${{ inputs.warm }}
    steps:
      - name: Mark start
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: sudo apt-get update -y >/dev/null && sudo apt-get install -y stress-ng >/dev/null
      - name: Machine and set-up time
        run: |
          mkdir -p results
          echo "FL2P_SETUP_S=$(( $(date +%s) - T0 ))" >> "$GITHUB_ENV"
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; echo "$ImageOS $ImageVersion"; stress-ng --version; } | tee results/machine.txt
      - name: Canary in its own process
        run: |
          nohup uv run fl2p canary --out "results/canary-${{ matrix.family }}.jsonl" --interval 10 > results/canary.log 2>&1 &
          echo "CANARY_PID=$!" >> "$GITHUB_ENV"
      - name: Run the family
        timeout-minutes: 65
        run: |
          SEEDARG=""; [ -n "$SEED" ] && SEEDARG="--seed $SEED"
          full() { [ "$SCALE" = full ]; }
          case "${{ matrix.family }}" in
            pool)
              if full; then N=9000; X="timing-race=9000"; else N=60; X="timing-race=60"; fi
              uv run fl2p pool --n "$N" --budget "$DUR" --extra "$X" $SEEDARG --out results/pool-base.json.gz ;;
            suite)
              if full; then K=$REPS; else K=6; fi
              uv run fl2p suite --strategy s0 --k "$K" --passes 1 $SEEDARG --out results/suite-s0-p1-base.json
              uv run fl2p suite --strategy s1 --k "$K" --passes 1 $SEEDARG --out results/suite-s1-p1-base.json
              uv run fl2p suite --strategy s1 --k "$K" --passes 3 $SEEDARG --out results/suite-s1-p3-base.json
              uv run fl2p suite --strategy s1 --k "$K" --passes 10 $SEEDARG --out results/suite-s1-p10-base.json
              KJ=$(( K / 3 )); [ "$KJ" -lt 3 ] && KJ=3
              uv run fl2p suite --strategy s1 --k "$KJ" --passes 5 --arm jitter $SEEDARG --out results/suite-s1-p5-jitter.json ;;
            forced)
              if full; then K=30; else K=3; fi
              uv run fl2p forced --k "$K" --out results/forced.json ;;
            noise)
              if full; then N=1500; B=6; R=5000; K=60; else N=40; B=2; R=60; K=3; fi
              uv run fl2p noise --arms "base,cpus2,stress50,stress100,cpus2+stress100" --n "$N" --budget "$B" --race-n "$R" --k "$K" $SEEDARG --out-dir results ;;
            prop)
              if full; then K=50; E=100; else K=2; E=15; fi
              uv run fl2p prop --k "$K" --examples "$E" --steps 12 $SEEDARG --out results/prop.json ;;
            repeat)
              if full; then K=30; NM=300; else K=2; NM=12; fi
              uv run fl2p repeat --scope function --k "$K" --nmax "$NM" --out results/repeat-function.json
              uv run fl2p repeat --scope session --k "$K" --nmax "$NM" --out results/repeat-session.json ;;
            meta)
              if full; then NS="1 10 50 100"; RP=3; SD=30; CN=3000; else NS="1 5"; RP=1; SD=3; CN=30; fi
              uv run fl2p pytestcost --ns $NS --reps "$RP" $SEEDARG --out results/pytestcost.json
              uv run fl2p pytestcheck --seeds "$SD" $SEEDARG --out results/pytestcheck.json
              uv run fl2p calib --arms "base,stress100" --margins "0.25,0.5,1.0,2.0" --n "$CN" --out results/calib.json ;;
          esac
      - name: Finish
        if: always()
        run: |
          kill "$CANARY_PID" 2>/dev/null || true
          pkill stress-ng 2>/dev/null || true
          uv run fl2p analyze results --out results/report || true
          gzip -f results/*.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-planted-${{ inputs.occasion }}-inmem-${{ matrix.family }}
          path: spikes/flakiness2/planted/results
          retention-days: 90
  real:
    if: github.event_name == 'workflow_dispatch' && (inputs.group == 'real' || inputs.group == 'both')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [settle, tx, purge]
    env:
      SCALE: ${{ inputs.scale }}
      SEED: ${{ inputs.seed }}
      MULT: ${{ inputs.mult }}
    steps:
      - name: Mark start
        run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: sudo apt-get update -y >/dev/null && sudo apt-get install -y stress-ng >/dev/null
      - name: Start the engine
        run: |
          mkdir -p results
          echo "FL2P_SETUP_S=$(( $(date +%s) - T0 ))" >> "$GITHUB_ENV"
          s=$(date +%s); ../../../write-path/scripts/ci-start-engine.sh | tee results/engine-start.txt
          echo "FL2P_ENGINE_START_S=$(( $(date +%s) - s ))" >> "$GITHUB_ENV"
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; echo "$ImageOS $ImageVersion"; } | tee results/machine.txt
      - name: Canary in its own process, search query on the engine
        run: |
          nohup uv run fl2p canary --out "results/canary-real-${{ matrix.shard }}.jsonl" --interval 10 --uri "$FL2P_URI" > results/canary.log 2>&1 &
          echo "CANARY_PID=$!" >> "$GITHUB_ENV"
      - name: Run the shard
        timeout-minutes: 62
        run: |
          SEEDARG=""; [ -n "$SEED" ] && SEEDARG="--seed $SEED"
          case "${{ matrix.shard }}" in
            settle) AT="r-settle-b1.01,r-settle-b1.02"; ARMS="base,engine1,stress100" ;;
            tx) AT="r-tx-partial-b1.01,r-tx-partial-b1.02"; ARMS="base,engine1,stress100" ;;
            purge) AT=""; ARMS="base" ;;
          esac
          uv run fl2p real --shard "${{ matrix.shard }}" --n-scale "$SCALE" --smoke-n 4 --mult "$MULT" --workers 4 --arms "$ARMS" --arm-tests "$AT" --arm-frac 0.3 $SEEDARG --out-dir results
      - name: Finish
        if: always()
        run: |
          kill "$CANARY_PID" 2>/dev/null || true
          pkill stress-ng 2>/dev/null || true
          docker logs "$WP_CONTAINER" 2>&1 | tail -n 300 > results/engine.log || true
          docker rm -f "$WP_CONTAINER" >/dev/null 2>&1 || true
          uv run fl2p analyze results --out results/report || true
          gzip -f results/*.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-planted-${{ inputs.occasion }}-real-${{ matrix.shard }}
          path: spikes/flakiness2/planted/results
          retention-days: 90
