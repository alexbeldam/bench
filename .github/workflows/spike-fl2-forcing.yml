name: spike-fl2-forcing
# Exact-lag forcing experiments against the search engine container: fail point, Toxiproxy and tc netem, SIGSTOP pause,
# and the drop-and-recreate race. One job per group, own runner and engine. On push every group runs at smoke scale
# (artifact fl2-forcing-smoke-<group>): its timings are NOT results.
on:
  push:
    paths: ["spikes/flakiness2/forcing/**", ".github/workflows/spike-fl2-forcing.yml"]
  workflow_dispatch:
    inputs:
      group:
        description: "Which job group to run"
        type: choice
        default: pause
        options: [failcmd, toxi, pause, ghost]
      n:
        description: "Blocks of randomised arms per group (ghost: repetitions per warm arm)"
        type: string
        default: "20"
      fresh_n:
        description: "Group ghost only, blocks of the fresh-engine arm (each repetition restarts the engine)"
        type: string
        default: "20"
      bound:
        description: "Group ghost only, seconds to wait for the index to become queryable"
        type: string
        default: "20"
      seed:
        description: "Seed for the randomised order of arms"
        type: string
        default: "20261023"
      occasion:
        description: "Label of this occasion, for example run1 (goes into the artifact name)"
        type: string
        default: "run1"
permissions:
  contents: read
env:
  WP_CONTAINER: hoodie-fl2-forcing
  WP_PORT: "29301"
  WP_CPUS: "3"
  WP_MEM: "10g"
  FL_CONTAINER: hoodie-fl2-forcing
  FL_PORT: "29301"
  N: ${{ github.event_name == 'push' && '1' || inputs.n }}
  FRESH_N: ${{ github.event_name == 'push' && '1' || inputs.fresh_n }}
  BOUND: ${{ github.event_name == 'push' && '8' || inputs.bound }}
  SEED: ${{ github.event_name == 'push' && '20261023' || inputs.seed }}
  LABEL: ${{ github.event_name == 'push' && 'smoke' || inputs.occasion }}
  FL_SMOKE: ${{ github.event_name == 'push' && '1' || '0' }}
defaults:
  run:
    shell: bash
    working-directory: spikes/flakiness2/forcing
jobs:
  failcmd:
    if: github.event_name == 'push' || inputs.group == 'failcmd'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee results/machine.txt
      - name: Pull images
        run: |
          docker pull mongodb/mongodb-atlas-local:8.0 >/dev/null
      - name: Start the stock engine
        run: ../../../write-path/scripts/ci-start-engine.sh
      - name: Fail point group
        run: uv run python bench.py failcmd "$N" results/failcmd.json "$SEED"
        timeout-minutes: 130
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 400 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" hoodie-fl2-tp hoodie-fl2-tc >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-forcing-${{ env.LABEL }}-failcmd
          path: spikes/flakiness2/forcing/results
          retention-days: 90
  toxi:
    if: github.event_name == 'push' || inputs.group == 'toxi'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee results/machine.txt
      - name: Pull images
        run: |
          docker pull mongodb/mongodb-atlas-local:8.0 >/dev/null
          docker pull ghcr.io/shopify/toxiproxy:2.13.0 >/dev/null
          docker pull alpine:3.20 >/dev/null
      - name: Proxy and netem group
        run: uv run python bench.py toxi "$N" results/toxi.json "$SEED"
        timeout-minutes: 160
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 400 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" hoodie-fl2-tp hoodie-fl2-tc >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-forcing-${{ env.LABEL }}-toxi
          path: spikes/flakiness2/forcing/results
          retention-days: 90
  pause:
    if: github.event_name == 'push' || inputs.group == 'pause'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee results/machine.txt
      - name: Start the stock engine
        run: ../../../write-path/scripts/ci-start-engine.sh
      - name: Pause group
        run: uv run python bench.py pause "$N" results/pause.json "$SEED"
        timeout-minutes: 80
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 400 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" hoodie-fl2-tp hoodie-fl2-tc >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-forcing-${{ env.LABEL }}-pause
          path: spikes/flakiness2/forcing/results
          retention-days: 90
  ghost:
    if: github.event_name == 'push' || inputs.group == 'ghost'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee results/machine.txt
      - name: Start the stock engine
        run: ../../../write-path/scripts/ci-start-engine.sh
      - name: Ghost index group
        run: uv run python bench.py ghost "$N" results/ghost.json.gz "$SEED" "$FRESH_N" "$BOUND"
        timeout-minutes: 100
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 400 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" hoodie-fl2-tp hoodie-fl2-tc >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-forcing-${{ env.LABEL }}-ghost
          path: spikes/flakiness2/forcing/results
          retention-days: 90
