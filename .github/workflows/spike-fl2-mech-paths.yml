name: spike-fl2-mech-paths
on:
  pull_request:
    branches: [fl2-mech-base-a]
    paths: ["spikes/flakiness2/mechanics/proj/src/**"]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  paths-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash spikes/flakiness2/mechanics/harness/env.sh
      - run: sleep 5
