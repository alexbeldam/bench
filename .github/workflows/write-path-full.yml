name: write-path-full
# Real measurements. Dispatch one job group at a time; see write-path/RUNBOOK.md for the order and the three
# occasions. Every job starts its own runner and engine, loads its own data and uploads its own artifact.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which job group to run (stateful groups marker and failure run last, each alone)"
        type: choice
        default: probe
        options: [probe, latency, coalesce, marker, failure, m0]
      scale:
        description: "Documents per entity"
        type: choice
        default: 1m
        options: [100k, 1m, 10m]
      rtts:
        description: "Simulated round-trip times in ms (comma list; 0 = direct)"
        type: string
        default: "0,1,5"
      rates:
        description: "Write rates per second (comma list)"
        type: string
        default: "10,100,500"
      reps:
        description: "Repetitions per case (randomized blocks)"
        type: string
        default: "5"
      duration:
        description: "Seconds per measured case run"
        type: string
        default: "30"
      warm:
        description: "Warm-up seconds inside each case run"
        type: string
        default: "5"
      seed:
        description: "Shuffle seed; empty means random (it is logged and stored)"
        type: string
        default: ""
      marker_minutes:
        description: "Marker-growth duration per sub-run in minutes (group marker)"
        type: string
        default: "60"
      fail_pct:
        description: "Share of writes that leave a failed marker (group marker)"
        type: string
        default: "0.01"
      occasion:
        description: "Label of this occasion, for example run1-morning (goes into the artifact name)"
        type: string
        default: "run1"
permissions:
  contents: read
env:
  WP_CONTAINER: hoodie-writepath
  WPBENCH_RESULTS: ${{ github.workspace }}/write-path/results/out
  RUN_ID: ${{ inputs.occasion }}-${{ inputs.group }}-${{ inputs.scale }}
  SEED_ARG: ${{ inputs.seed != '' && format('--seed {0}', inputs.seed) || '' }}
defaults:
  run:
    shell: bash
    working-directory: write-path
jobs:
  probe:
    if: inputs.group == 'probe'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: scripts/ci-start-engine.sh
      - name: Probe shapes, clause limit, token semantics, command counts, coalescing
        run: >
          uv run wpbench run --scale ${{ inputs.scale }} --run-id "$RUN_ID" $SEED_ARG --reps ${{ inputs.reps }}
          --rtts "${{ inputs.rtts }}" --rates "${{ inputs.rates }}" --duration ${{ inputs.duration }}
          --warm ${{ inputs.warm }} --container hoodie-writepath
          --phases clauses,semantics,counts,shapes,coalesce
      - run: scripts/ci-finish.sh "$WPBENCH_RESULTS"
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: write-path-${{ env.RUN_ID }}
          path: write-path/results/out
  latency:
    if: inputs.group == 'latency'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: scripts/ci-start-engine.sh
      - name: Time to searchable, STRONG and EVENTUAL overhead at each simulated round-trip time
        run: >
          uv run wpbench run --scale ${{ inputs.scale }} --run-id "$RUN_ID" $SEED_ARG --reps ${{ inputs.reps }}
          --rtts "${{ inputs.rtts }}" --rates "${{ inputs.rates }}" --duration ${{ inputs.duration }}
          --warm ${{ inputs.warm }} --container hoodie-writepath --phases latency
      - run: scripts/ci-finish.sh "$WPBENCH_RESULTS"
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: write-path-${{ env.RUN_ID }}
          path: write-path/results/out
  coalesce:
    if: inputs.group == 'coalesce'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: scripts/ci-start-engine.sh
      - name: Probe wait groups: independent, shared and sentinel polling
        run: >
          uv run wpbench run --scale ${{ inputs.scale }} --run-id "$RUN_ID" $SEED_ARG --reps ${{ inputs.reps }}
          --rtts "${{ inputs.rtts }}" --rates "${{ inputs.rates }}" --duration ${{ inputs.duration }}
          --warm ${{ inputs.warm }} --container hoodie-writepath --phases coalesce
      - run: scripts/ci-finish.sh "$WPBENCH_RESULTS"
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: write-path-${{ env.RUN_ID }}
          path: write-path/results/out
  marker:
    if: inputs.group == 'marker'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: scripts/ci-start-engine.sh
      - name: Marker growth at the design rate, clean and with failures
        run: >
          uv run wpbench run --scale ${{ inputs.scale }} --run-id "$RUN_ID" $SEED_ARG
          --rates "${{ inputs.rates }}" --warm ${{ inputs.warm }} --marker-minutes ${{ inputs.marker_minutes }}
          --fail-pct ${{ inputs.fail_pct }} --container hoodie-writepath --phases marker
      - run: scripts/ci-finish.sh "$WPBENCH_RESULTS"
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: write-path-${{ env.RUN_ID }}
          path: write-path/results/out
  failure:
    if: inputs.group == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: scripts/ci-start-engine.sh
      - name: Failure behaviour (blind index, partial transaction failure, paused search process)
        run: >
          uv run wpbench run --scale ${{ inputs.scale }} --run-id "$RUN_ID" $SEED_ARG --container hoodie-writepath
          --phases failure
      - run: scripts/ci-finish.sh "$WPBENCH_RESULTS"
        if: always()
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: write-path-${{ env.RUN_ID }}
          path: write-path/results/out
  m0:
    if: inputs.group == 'm0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # One M0 job at a time across every workflow (see narrowing-ci.yml).
    concurrency:
      group: m0-cluster
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Hosted Atlas M0 (informational; skipped when the secret is not set)
        run: uv run wpbench run --scale smoke --run-id "$RUN_ID" --phases m0 --rates 5
        env:
          HOODIE_BENCH_ATLAS_URL: ${{ secrets.HOODIE_BENCH_ATLAS_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: write-path-${{ env.RUN_ID }}
          path: write-path/results/out
