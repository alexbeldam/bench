name: spike-flakiness
# Engine start-up stages, index lag and race forcing against the search engine. One job per group, own runner and engine.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which job group to run"
        type: choice
        default: lag
        options: [startup, lag, stale, ghost, ties]
      n:
        description: "Cycles (lag), repetitions (stale, ghost), index builds (ties), cycles per worker (startup)"
        type: string
        default: "400"
      workers:
        description: "Worker counts sharing one engine (group startup)"
        type: string
        default: "1,2,4,8"
      occasion:
        description: "Label of this occasion, for example run1 (goes into the artifact name)"
        type: string
        default: "run1"
permissions:
  contents: read
env:
  FL_CONTAINER: hoodie-s4-engine
  FL_PORT: "27217"
  WP_CONTAINER: hoodie-s4-engine
  WP_PORT: "27217"
  WP_CPUS: "3"
  WP_MEM: "10g"
defaults:
  run:
    shell: bash
    working-directory: spikes/flakiness
jobs:
  startup:
    if: inputs.group == 'startup'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee results/machine.txt
      - name: Image pull time
        run: |
          s=$(date +%s.%N); docker pull mongodb/mongodb-atlas-local:8.0 >/dev/null; e=$(date +%s.%N)
          echo "pull_s=$(echo "$e - $s" | bc)" | tee results/pull.txt
          docker image inspect mongodb/mongodb-atlas-local:8.0 --format '{{.Id}} {{.Size}} {{json .RepoDigests}}' | tee -a results/pull.txt
      - name: Cold start stages, then workers sharing one engine
        run: uv run python bench.py startup hoodie-s4-cold 27218 results/startup.json ${{ inputs.workers }} ${{ inputs.n }}
        timeout-minutes: 40
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: flakiness-${{ inputs.occasion }}-startup
          path: spikes/flakiness/results
          retention-days: 90
  lag:
    if: inputs.group == 'lag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../write-path/scripts/ci-start-engine.sh
      - name: Write-to-searchable and delete-to-zero lag
        run: mkdir -p results && uv run python bench.py lag ${{ inputs.n }} results/lag.json
        timeout-minutes: 100
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 500 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: flakiness-${{ inputs.occasion }}-lag
          path: spikes/flakiness/results
          retention-days: 90
  stale:
    if: inputs.group == 'stale'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../write-path/scripts/ci-start-engine.sh
      - name: Exact total after a delete, plain and with the index process paused
        run: mkdir -p results && uv run python bench.py stale ${{ inputs.n }} results/stale.json
        timeout-minutes: 70
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 500 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: flakiness-${{ inputs.occasion }}-stale
          path: spikes/flakiness/results
          retention-days: 90
  ghost:
    if: inputs.group == 'ghost'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../write-path/scripts/ci-start-engine.sh
      - name: Drop a collection under its search index, three orders
        run: mkdir -p results && uv run python bench.py ghost ${{ inputs.n }} results/ghost.json
        timeout-minutes: 100
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 500 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: flakiness-${{ inputs.occasion }}-ghost
          path: spikes/flakiness/results
          retention-days: 90
  ties:
    if: inputs.group == 'ties'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../write-path/scripts/ci-start-engine.sh
      - name: Native tie order against score then id, over index builds
        run: mkdir -p results && uv run python bench.py ties ${{ inputs.n }} results/ties.json
        timeout-minutes: 40
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$FL_CONTAINER" 2>&1 | tail -n 500 > results/engine.log || true
          docker rm -f "$FL_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: flakiness-${{ inputs.occasion }}-ties
          path: spikes/flakiness/results
          retention-days: 90
