name: spike-fl2-cost
# Cost of a search-backed test suite in CI: image source (cache against pull), the real suite on one shared engine with
# and without xdist, a 2-CPU emulation, and a synthetic suite model. One job per group, own runner and engine.
# Group image needs two dispatches with the same key: the first misses and saves, the second restores.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which job group to run"
        type: choice
        default: suite
        options: [image, suite, cpu2, model]
      occasion:
        description: "Label of this occasion, for example run1 (goes into the artifact name)"
        type: string
        default: "run1"
      reps:
        description: "Repetitions inside the job (empty: suite and cpu2 3, model 2)"
        type: string
        default: ""
      seed:
        description: "Seed for the randomised order of arms"
        type: string
        default: "1"
      workers:
        description: "xdist worker counts, 0 means no xdist (empty: suite and cpu2 0,1,2,4,8, model 0,2,4,8,12,16)"
        type: string
        default: ""
      pins:
        description: "Group model: CPU emulation arms, 0 is the whole 4 vCPU runner, 2 is the 2 CPU emulation (for example 0,2)"
        type: string
        default: "0"
      key:
        description: "Cache key (group image)"
        type: string
        default: "fl2-image-v1"
      s:
        description: "Engine tests of the model, one write-and-wait each (group model)"
        type: string
        default: "420"
      m:
        description: "Engine-free tests of the model (group model)"
        type: string
        default: "1300"
      fast_ms:
        description: "CPU milliseconds of each engine-free test (group model)"
        type: string
        default: "40"
permissions:
  contents: read
env:
  IMAGE: mongodb/mongodb-atlas-local:8.0
defaults:
  run:
    shell: bash
    working-directory: spikes/flakiness2/suite
jobs:
  image:
    if: inputs.group == 'image'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Machine
        run: |
          mkdir -p ../cost/results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee ../cost/results/machine.txt
      - run: python3 ../cost/cost.py mark ../cost/results/image.jsonl restore_start
      - id: r
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/fl2-image
          key: ${{ inputs.key }}
      - run: python3 ../cost/cost.py mark ../cost/results/image.jsonl restore_end hit=${{ steps.r.outputs.cache-hit == 'true' }}
      - name: Load path, pull path, save on a miss
        run: python3 ../cost/cost.py image ../cost/results/image.jsonl --hit ${{ steps.r.outputs.cache-hit == 'true' }} --key "${{ inputs.key }}"
      - if: steps.r.outputs.cache-hit != 'true'
        run: python3 ../cost/cost.py mark ../cost/results/image.jsonl save_cache_start
      - if: steps.r.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/fl2-image
          key: ${{ inputs.key }}
      - if: steps.r.outputs.cache-hit != 'true'
        run: python3 ../cost/cost.py mark ../cost/results/image.jsonl save_cache_end
      - name: Finish
        if: always()
        run: |
          docker rm -f hoodie-fl2-cost >/dev/null 2>&1 || true
          python3 ../cost/cost.py analyze ../cost/results --out ../cost/results/analysis || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-cost-${{ inputs.occasion }}-image
          path: spikes/flakiness2/cost/results
          retention-days: 90
  suite:
    if: inputs.group == 'suite'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p ../cost/results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee ../cost/results/machine.txt
      - name: Image pull time
        run: |
          s=$(date +%s.%N); docker pull $IMAGE >/dev/null; e=$(date +%s.%N)
          echo "pull_s=$(echo "$e - $s" | bc)" | tee ../cost/results/pull.txt
      - name: Real suite on one shared engine with and without a CPU limit
        run: uv run python ../cost/cost.py suite ../cost/results/suite.json --label suite --cpus 3,0 ${{ inputs.workers && format('--workers {0}', inputs.workers) || '' }} ${{ inputs.reps && format('--reps {0}', inputs.reps) || '' }} --seed ${{ inputs.seed }}
        timeout-minutes: 135
      - name: Finish
        if: always()
        run: |
          docker rm -f hoodie-fl2-cost >/dev/null 2>&1 || true
          uv run python ../cost/cost.py analyze ../cost/results --out ../cost/results/analysis || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-cost-${{ inputs.occasion }}-suite
          path: spikes/flakiness2/cost/results
          retention-days: 90
  cpu2:
    if: inputs.group == 'cpu2'
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p ../cost/results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee ../cost/results/machine.txt
      - name: Image pull time
        run: |
          s=$(date +%s.%N); docker pull $IMAGE >/dev/null; e=$(date +%s.%N)
          echo "pull_s=$(echo "$e - $s" | bc)" | tee ../cost/results/pull.txt
      - name: Real suite on 4 vCPU and pinned to 2 CPUs (emulation of a 2 vCPU runner), same job
        run: uv run python ../cost/cost.py suite ../cost/results/cpu2.json --label cpu2 --pins 0,2 --cpus 3 ${{ inputs.workers && format('--workers {0}', inputs.workers) || '' }} ${{ inputs.reps && format('--reps {0}', inputs.reps) || '' }} --seed ${{ inputs.seed }}
        timeout-minutes: 180
      - name: Finish
        if: always()
        run: |
          docker rm -f hoodie-fl2-cost >/dev/null 2>&1 || true
          uv run python ../cost/cost.py analyze ../cost/results --out ../cost/results/analysis || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-cost-${{ inputs.occasion }}-cpu2
          path: spikes/flakiness2/cost/results
          retention-days: 90
  model:
    if: inputs.group == 'model'
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p ../cost/results
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; } | tee ../cost/results/machine.txt
      - name: Image pull time
        run: |
          s=$(date +%s.%N); docker pull $IMAGE >/dev/null; e=$(date +%s.%N)
          echo "pull_s=$(echo "$e - $s" | bc)" | tee ../cost/results/pull.txt
      - name: Synthetic suite at several worker counts
        run: uv run python ../cost/cost.py model ../cost/results/model.json ${{ inputs.workers && format('--workers {0}', inputs.workers) || '' }} ${{ inputs.reps && format('--reps {0}', inputs.reps) || '' }} --seed ${{ inputs.seed }} --s ${{ inputs.s }} --m ${{ inputs.m }} --fast-ms ${{ inputs.fast_ms }} --pins ${{ inputs.pins }}
        timeout-minutes: 240
      - name: Finish
        if: always()
        run: |
          docker rm -f hoodie-fl2-cost >/dev/null 2>&1 || true
          uv run python ../cost/cost.py analyze ../cost/results --out ../cost/results/analysis || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-cost-${{ inputs.occasion }}-model
          path: spikes/flakiness2/cost/results
          retention-days: 90
