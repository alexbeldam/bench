name: spike-probe
# Version probe forms and delete-then-recreate rules against the search engine. Dispatch one group at a time;
# see spikes/RUNBOOK.md. Every job has its own runner, engine and artifact.
on:
  workflow_call:
    inputs:
      scenarios:
        type: string
        default: "same_young,same_old,same_old_stall,new_old,new_old_stall,same_slow_control"
      group:
        type: string
        required: true
      reps:
        type: string
        default: "10"
      duration:
        type: string
        default: "30"
      docs:
        type: string
        default: "1000000"
      occasion:
        type: string
        default: "run1"
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenarios (group recreate)"
        type: string
        default: "same_young,same_old,same_old_stall,new_old,new_old_stall,same_slow_control"
      group:
        description: "Which job group to run"
        type: choice
        default: recreate
        options: [recreate, hot, size]
      reps:
        description: "Repetitions (recreate and hot)"
        type: string
        default: "10"
      duration:
        description: "Seconds per hot-document case (group hot)"
        type: string
        default: "30"
      docs:
        description: "Documents for the index-size run (group size)"
        type: string
        default: "1000000"
      occasion:
        description: "Label of this occasion, for example run1-morning (goes into the artifact name)"
        type: string
        default: "run1"
permissions:
  contents: read
env:
  WP_CONTAINER: hoodie-s2-engine
  WP_PORT: "27212"
  WP_CPUS: "3"
  WP_MEM: "10g"
defaults:
  run:
    shell: bash
    working-directory: spikes/probe
jobs:
  recreate:
    if: inputs.group == 'recreate'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../write-path/scripts/ci-start-engine.sh
      - name: Rules A, A2, B, C on same-id and new-id recreate
        run: >
          uv run python q3.py ${{ inputs.reps }}
          ${{ inputs.scenarios }} ${{ inputs.occasion }}
        timeout-minutes: 200
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$WP_CONTAINER" 2>&1 | tail -n 2000 > results/engine.log || true
          docker rm -f "$WP_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-probe-${{ inputs.occasion }}-recreate
          path: spikes/probe/results
          retention-days: 90
  hot:
    if: inputs.group == 'hot'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../write-path/scripts/ci-start-engine.sh
      - name: Probe forms under one and five hot documents at 200 and 1000 writes per second
        run: uv run python q2.py ${{ inputs.reps }} P1,P2,P3 ${{ inputs.duration }} ${{ inputs.occasion }}
        timeout-minutes: 270
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$WP_CONTAINER" 2>&1 | tail -n 2000 > results/engine.log || true
          docker rm -f "$WP_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-probe-${{ inputs.occasion }}-hot
          path: spikes/probe/results
          retention-days: 90
  size:
    if: inputs.group == 'size'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - run: ../../write-path/scripts/ci-start-engine.sh
      - name: Index size and build time per index definition
        run: uv run python q4.py ${{ inputs.docs }} ${{ inputs.occasion }}
        timeout-minutes: 300
      - name: Finish
        if: always()
        run: |
          mkdir -p results; docker logs "$WP_CONTAINER" 2>&1 | tail -n 2000 > results/engine.log || true
          docker rm -f "$WP_CONTAINER" >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-probe-${{ inputs.occasion }}-size
          path: spikes/probe/results
          retention-days: 90
