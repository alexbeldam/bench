name: spike-fl2-es
# Refresh, visibility, ordering and race experiments on Elasticsearch and OpenSearch. One job per group; the matrix has one cell per
# engine family, and a cell runs its images one after the other on the same runner (same CPU), in random order, one engine container at a
# time, with one artifact per image. Also called by spike-fl2-es-smoke.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which job group to run"
        type: choice
        default: lag
        options: [start, lag, stale, ties, races, stress]
      n:
        description: "Cycles (lag), repeats (stale, races), builds per config capped at 15 (ties), repeats times ten (stress), cold starts capped at 5 (start)"
        type: string
        default: "200"
      occasion:
        description: "Label of this occasion, for example run1 (goes into the artifact name)"
        type: string
        default: "run1"
      images:
        description: "Image ids as a JSON list (see IMAGES in bench.py)"
        type: string
        default: '["es-9.5.5","es-9.4.8","os-3.9.0","os-3.8.0"]'
  workflow_call:
    inputs:
      group:
        type: string
        required: true
      n:
        type: string
        required: true
      occasion:
        type: string
        required: true
      images:
        type: string
        required: true
permissions:
  contents: read
env:
  FL2_CPUS: "3"
  FL2_MEM: "10g"
  FL2_HEAP: "4g"
defaults:
  run:
    shell: bash
    working-directory: spikes/flakiness2/es
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    outputs:
      cells: ${{ steps.p.outputs.cells }}
    steps:
      - id: p
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          imgs = json.loads(os.environ["IMAGES"])
          cells = []
          for fam in ("es", "os"):
              xs = [i for i in imgs if i.startswith(fam)]
              if xs:
                  cells.append({"fam": fam, "imgs": " ".join(xs), "a": xs[0], "b": xs[1] if len(xs) > 1 else ""})
          print("cells=" + json.dumps(cells))
          PY
  start:
    if: inputs.group == 'start'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Cold start stages
        env:
          IMGS: ${{ matrix.cell.imgs }}
        run: |
          export FL2_SEED=$(date +%s)
          rc=0
          for img in $(shuf -e $IMGS); do
          export FL2_IMAGE=$img
          mkdir -p "results/$img"; cp results/machine.txt "results/$img/"
          uv run python bench.py start ${{ inputs.n }} "results/$img/start.json" || rc=1
          uv run python bench.py down
          done
          exit $rc
        timeout-minutes: 60
      - name: Remove engine containers
        if: always()
        run: docker rm -f hoodie-fl2-es hoodie-fl2-os >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-start-${{ matrix.cell.a }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.a }}
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cell.b != ''
        with:
          name: fl2-es-${{ inputs.occasion }}-start-${{ matrix.cell.b }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.b }}
          retention-days: 90
  lag:
    if: inputs.group == 'lag'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Write-to-searchable and delete-to-total lag
        env:
          IMGS: ${{ matrix.cell.imgs }}
        run: |
          export FL2_SEED=$(date +%s)
          rc=0
          for img in $(shuf -e $IMGS); do
          export FL2_IMAGE=$img
          mkdir -p "results/$img"; cp results/machine.txt "results/$img/"
          uv run python bench.py up || { rc=1; continue; }
          uv run python bench.py lag ${{ inputs.n }} "results/$img/lag.json" || rc=1
          uv run python bench.py savelog "results/$img" || true
          uv run python bench.py down
          done
          exit $rc
        timeout-minutes: 270
      - name: Remove engine containers
        if: always()
        run: docker rm -f hoodie-fl2-es hoodie-fl2-os >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-lag-${{ matrix.cell.a }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.a }}
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cell.b != ''
        with:
          name: fl2-es-${{ inputs.occasion }}-lag-${{ matrix.cell.b }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.b }}
          retention-days: 90
  stale:
    if: inputs.group == 'stale'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Stale total after a delete
        env:
          IMGS: ${{ matrix.cell.imgs }}
        run: |
          export FL2_SEED=$(date +%s)
          rc=0
          for img in $(shuf -e $IMGS); do
          export FL2_IMAGE=$img
          mkdir -p "results/$img"; cp results/machine.txt "results/$img/"
          uv run python bench.py up || { rc=1; continue; }
          uv run python bench.py stale ${{ inputs.n }} "results/$img/stale.json" || rc=1
          uv run python bench.py savelog "results/$img" || true
          uv run python bench.py down
          done
          exit $rc
        timeout-minutes: 150
      - name: Remove engine containers
        if: always()
        run: docker rm -f hoodie-fl2-es hoodie-fl2-os >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-stale-${{ matrix.cell.a }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.a }}
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cell.b != ''
        with:
          name: fl2-es-${{ inputs.occasion }}-stale-${{ matrix.cell.b }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.b }}
          retention-days: 90
  ties:
    if: inputs.group == 'ties'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Tie order over index builds
        env:
          IMGS: ${{ matrix.cell.imgs }}
        run: |
          export FL2_SEED=$(date +%s)
          rc=0
          for img in $(shuf -e $IMGS); do
          export FL2_IMAGE=$img
          mkdir -p "results/$img"; cp results/machine.txt "results/$img/"
          uv run python bench.py up || { rc=1; continue; }
          uv run python bench.py ties ${{ inputs.n }} "results/$img/ties.json" || rc=1
          uv run python bench.py savelog "results/$img" || true
          uv run python bench.py down
          done
          exit $rc
        timeout-minutes: 120
      - name: Remove engine containers
        if: always()
        run: docker rm -f hoodie-fl2-es hoodie-fl2-os >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-ties-${{ matrix.cell.a }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.a }}
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cell.b != ''
        with:
          name: fl2-es-${{ inputs.occasion }}-ties-${{ matrix.cell.b }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.b }}
          retention-days: 90
  races:
    if: inputs.group == 'races'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Race forcing tests
        env:
          IMGS: ${{ matrix.cell.imgs }}
        run: |
          export FL2_SEED=$(date +%s)
          rc=0
          for img in $(shuf -e $IMGS); do
          export FL2_IMAGE=$img
          mkdir -p "results/$img"; cp results/machine.txt "results/$img/"
          uv run python bench.py up || { rc=1; continue; }
          uv run python bench.py races ${{ inputs.n }} "results/$img/races.json" || rc=1
          uv run python bench.py savelog "results/$img" || true
          uv run python bench.py down
          done
          exit $rc
        timeout-minutes: 150
      - name: Remove engine containers
        if: always()
        run: docker rm -f hoodie-fl2-es hoodie-fl2-os >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-races-${{ matrix.cell.a }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.a }}
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cell.b != ''
        with:
          name: fl2-es-${{ inputs.occasion }}-races-${{ matrix.cell.b }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.b }}
          retention-days: 90
  stress:
    if: inputs.group == 'stress'
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Stress subset with several workers
        env:
          IMGS: ${{ matrix.cell.imgs }}
        run: |
          export FL2_SEED=$(date +%s)
          rc=0
          for img in $(shuf -e $IMGS); do
          export FL2_IMAGE=$img
          mkdir -p "results/$img"; cp results/machine.txt "results/$img/"
          uv run python bench.py up || { rc=1; continue; }
          uv run python bench.py stress ${{ inputs.n }} "results/$img/stress.json" || rc=1
          uv run python bench.py savelog "results/$img" || true
          uv run python bench.py down
          done
          exit $rc
        timeout-minutes: 120
      - name: Remove engine containers
        if: always()
        run: docker rm -f hoodie-fl2-es hoodie-fl2-os >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-stress-${{ matrix.cell.a }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.a }}
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && matrix.cell.b != ''
        with:
          name: fl2-es-${{ inputs.occasion }}-stress-${{ matrix.cell.b }}
          path: spikes/flakiness2/es/results/${{ matrix.cell.b }}
          retention-days: 90
