name: spike-fl2-es
# Refresh, visibility, ordering and race experiments on Elasticsearch and OpenSearch. One job per group, one matrix cell per image,
# each cell with its own runner and engine container. Also called by spike-fl2-es-smoke.
on:
  workflow_dispatch:
    inputs:
      group:
        description: "Which job group to run"
        type: choice
        default: lag
        options: [start, lag, stale, ties, races, stress]
      n:
        description: "Cycles (lag), repeats (stale, races), builds per config capped at 15 (ties), repeats times ten (stress), cold starts capped at 5 (start)"
        type: string
        default: "200"
      occasion:
        description: "Label of this occasion, for example run1 (goes into the artifact name)"
        type: string
        default: "run1"
      images:
        description: "Image ids as a JSON list (see IMAGES in bench.py)"
        type: string
        default: '["es-9.5.5","es-9.4.8","os-3.9.0","os-3.8.0"]'
  workflow_call:
    inputs:
      group:
        type: string
        required: true
      n:
        type: string
        required: true
      occasion:
        type: string
        required: true
      images:
        type: string
        required: true
permissions:
  contents: read
env:
  FL2_CPUS: "3"
  FL2_MEM: "10g"
  FL2_HEAP: "4g"
defaults:
  run:
    shell: bash
    working-directory: spikes/flakiness2/es
jobs:
  start:
    if: inputs.group == 'start'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      FL2_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Cold start stages
        run: uv run python bench.py start ${{ inputs.n }} results/start.json
        timeout-minutes: 30
      - name: Finish
        if: always()
        run: |
          mkdir -p results
          C=$(docker ps -a --format '{{.Names}}' | grep '^hoodie-fl2-' | head -1 || true)
          if [ -n "$C" ]; then docker logs "$C" 2>&1 | tail -n 300 > results/engine.log || true; fi
          uv run python bench.py down || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-start-${{ matrix.image }}
          path: spikes/flakiness2/es/results
          retention-days: 90
  lag:
    if: inputs.group == 'lag'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      FL2_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Start engine
        run: uv run python bench.py up
      - name: Write-to-searchable and delete-to-total lag
        run: uv run python bench.py lag ${{ inputs.n }} results/lag.json
        timeout-minutes: 100
      - name: Finish
        if: always()
        run: |
          mkdir -p results
          C=$(docker ps -a --format '{{.Names}}' | grep '^hoodie-fl2-' | head -1 || true)
          if [ -n "$C" ]; then docker logs "$C" 2>&1 | tail -n 300 > results/engine.log || true; fi
          uv run python bench.py down || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-lag-${{ matrix.image }}
          path: spikes/flakiness2/es/results
          retention-days: 90
  stale:
    if: inputs.group == 'stale'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      FL2_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Start engine
        run: uv run python bench.py up
      - name: Stale total after a delete
        run: uv run python bench.py stale ${{ inputs.n }} results/stale.json
        timeout-minutes: 70
      - name: Finish
        if: always()
        run: |
          mkdir -p results
          C=$(docker ps -a --format '{{.Names}}' | grep '^hoodie-fl2-' | head -1 || true)
          if [ -n "$C" ]; then docker logs "$C" 2>&1 | tail -n 300 > results/engine.log || true; fi
          uv run python bench.py down || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-stale-${{ matrix.image }}
          path: spikes/flakiness2/es/results
          retention-days: 90
  ties:
    if: inputs.group == 'ties'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      FL2_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Start engine
        run: uv run python bench.py up
      - name: Tie order over index builds
        run: uv run python bench.py ties ${{ inputs.n }} results/ties.json
        timeout-minutes: 40
      - name: Finish
        if: always()
        run: |
          mkdir -p results
          C=$(docker ps -a --format '{{.Names}}' | grep '^hoodie-fl2-' | head -1 || true)
          if [ -n "$C" ]; then docker logs "$C" 2>&1 | tail -n 300 > results/engine.log || true; fi
          uv run python bench.py down || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-ties-${{ matrix.image }}
          path: spikes/flakiness2/es/results
          retention-days: 90
  races:
    if: inputs.group == 'races'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      FL2_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Start engine
        run: uv run python bench.py up
      - name: Race forcing tests
        run: uv run python bench.py races ${{ inputs.n }} results/races.json
        timeout-minutes: 70
      - name: Finish
        if: always()
        run: |
          mkdir -p results
          C=$(docker ps -a --format '{{.Names}}' | grep '^hoodie-fl2-' | head -1 || true)
          if [ -n "$C" ]; then docker logs "$C" 2>&1 | tail -n 300 > results/engine.log || true; fi
          uv run python bench.py down || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-races-${{ matrix.image }}
          path: spikes/flakiness2/es/results
          retention-days: 90
  stress:
    if: inputs.group == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    env:
      FL2_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: pipx install uv==0.11.26 && uv python install 3.12 && uv sync
      - name: Machine
        run: |
          mkdir -p results
          sudo sysctl -w vm.max_map_count=262144
          { grep -m1 'model name' /proc/cpuinfo; nproc; free -m | head -2; df -h / | tail -1; docker --version; echo "$ImageOS $ImageVersion"; sysctl vm.max_map_count; } | tee results/machine.txt
      - name: Start engine
        run: uv run python bench.py up
      - name: Stress subset with several workers
        run: uv run python bench.py stress ${{ inputs.n }} results/stress.json
        timeout-minutes: 70
      - name: Finish
        if: always()
        run: |
          mkdir -p results
          C=$(docker ps -a --format '{{.Names}}' | grep '^hoodie-fl2-' | head -1 || true)
          if [ -n "$C" ]; then docker logs "$C" 2>&1 | tail -n 300 > results/engine.log || true; fi
          uv run python bench.py down || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fl2-es-${{ inputs.occasion }}-stress-${{ matrix.image }}
          path: spikes/flakiness2/es/results
          retention-days: 90
