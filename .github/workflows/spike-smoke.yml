name: spike-smoke
# Harness check on every push that touches the spike harnesses: the smallest input of each group (see
# spikes/RUNBOOK.md). Its timings are NOT results.
on:
  push:
    paths: ["spikes/probe/**", "spikes/feed/**", "write-path/scripts/**", ".github/workflows/spike-*.yml"]
  pull_request:
    paths: ["spikes/probe/**", "spikes/feed/**", "write-path/scripts/**", ".github/workflows/spike-*.yml"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        group: [recreate, hot, size]
    uses: ./.github/workflows/spike-probe.yml
    with:
      group: ${{ matrix.group }}
      reps: "1"
      duration: "10"
      docs: "100000"
      occasion: smoke-ci
  feed:
    strategy:
      fail-fast: false
      matrix:
        group: [streams, lazy, share, resume, memory]
    uses: ./.github/workflows/spike-feed.yml
    with:
      group: ${{ matrix.group }}
      trials: "500"
      occasion: smoke-ci
