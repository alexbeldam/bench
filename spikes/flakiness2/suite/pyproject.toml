[project]
name = "fl2-suite"
version = "0.1.0"
description = "Test suite used by the flakiness-strategy experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["beanie==2.2.0", "pymongo>=4.13", "numpy>=2.0"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "mongomock", "mongomock-motor", "pytest-xdist", "pytest-randomly", "pytest-repeat", "pytest-flakefinder", "pytest-testmon"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/searchkit", "src/txkit", "src/vt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests", "tests_vt"]
markers = ["stress: race-prone subset repeated for the flakiness gate", "backend_a: needs the real Atlas Search engine"]
