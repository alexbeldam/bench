[project]
name = "nbench"
version = "0.1.0"
description = "Narrowing and chunked-ID-constraint search benchmark (follow-up): layouts, load, facets, tuning, selectivity"
requires-python = ">=3.12,<3.13"
dependencies = ["pymongo>=4.13", "numpy>=2.0", "pandas>=2.2", "psutil>=6.0", "tqdm>=4.66"]

[project.scripts]
nbench = "nbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nbench"]
